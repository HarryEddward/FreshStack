name: Deploy to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  PROJECT_PATH: /home/ubuntu/FreshStack
  REPO_URL: https://github.com/${{ github.repository }}.git
  NETWORK_INTERFACE: eth0   # Cambia según la interfaz de tu VPS

jobs:
  sync-third-party-images:
    runs-on: ubuntu-latest
    if: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare manager and registry
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: PROJECT_PATH,REPO_URL,NETWORK_INTERFACE
          script: |
            set -e

            echo "🔍 Detectando IP del nodo manager..."
            MANAGER_IP=$(ip -4 addr show $NETWORK_INTERFACE | grep -oP '(?<=inet\s)\d+(\.\d+){3}' || true)

            if [ -z "$MANAGER_IP" ]; then
              echo "⚠️ No se detectó IP en $NETWORK_INTERFACE. Asignando IP estática..."
              
              # Ejemplo de IP estática. Cambia según tu red.
              STATIC_IP="10.0.0.10/24"
              GATEWAY="10.0.0.1"

              cat <<EOF | sudo tee /etc/netplan/01-netcfg.yaml
              network:
                version: 2
                renderer: networkd
                ethernets:
                  $NETWORK_INTERFACE:
                    dhcp4: no
                    addresses: [$STATIC_IP]
                    gateway4: $GATEWAY
                    nameservers:
                      addresses: [8.8.8.8,8.8.4.4]
              EOF

              sudo netplan apply
              MANAGER_IP=$(echo $STATIC_IP | cut -d/ -f1)
              echo "✅ IP asignada: $MANAGER_IP"
            else
              echo "✅ IP detectada: $MANAGER_IP"
            fi

            REGISTRY="${MANAGER_IP}:5000"
            echo "📌 Usaremos el registry local: $REGISTRY"

            # Verificar si el registry local está corriendo
            if ! sudo docker ps --format '{{.Image}}' | grep -q 'registry:2'; then
              echo "🚀 Iniciando registry local en $REGISTRY"
              sudo docker run -d \
                --name registry \
                --restart=always \
                -p 5000:5000 \
                -v /mnt/registry:/var/lib/registry \
                registry:2
            else
              echo "✅ Registry local ya está corriendo"
            fi

            # Lista de imágenes de terceros
            IMAGES=(
              "traefik:v3.1"
              "traefik/whoami:latest"
              "jenkins/jenkins:lts"
              "jenkins/inbound-agent:latest"
              "bitnami/redis:latest"
              "bitnami/redis-sentinel:latest"
              "chrislusf/seaweedfs:latest"
              "denoland/deno:alpine-1.41.2"
              "node:18-alpine"
              "quay.io/keycloak/keycloak:latest"
              "bitnamilegacy/pgbouncer:latest"
              "bitnamilegacy/postgresql-repmgr:latest"
              "nginx:alpine"
              "crowdsecurity/crowdsec:latest"
            )

            # Descargar, etiquetar y subir al registry local
            for image in "${IMAGES[@]}"; do
              echo "📥 Descargando imagen: ${image}"
              sudo docker pull "${image}"

              local_image="${REGISTRY}/$(echo ${image} | sed 's|.*/||')"
              echo "🏷️ Etiquetando como: ${local_image}"
              sudo docker tag "${image}" "${local_image}"

              echo "📤 Subiendo ${local_image} al registry local"
              sudo docker push "${local_image}"
            done

            echo "✅ Todas las imágenes están disponibles en $REGISTRY"
