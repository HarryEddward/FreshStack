name: Actualizar certificados SSL en VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  obtain-certificates:
    runs-on: ubuntu-latest
    env:
      PROJECT_PATH: /home/ubuntu/FreshStack
      REPO_URL: https://github.com/${{ github.repository }}.git
      SSL_CERT: ${{ secrets.SSL_CERT }}
      SSL_KEY: ${{ secrets.SSL_KEY }}

    steps:
      - name: Deploy SSL to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          # port: ${{ secrets.VPS_PORT }}   # puedes omitirlo si es 22
          envs: PROJECT_PATH,SSL_CERT,SSL_KEY,REPO_URL
          script: |
            set -euo pipefail

            echo "Actualizando certificados en $PROJECT_PATH ..."
            SSL_DIR="${PROJECT_PATH}/ssl"

            mkdir -p "$SSL_DIR"
            chmod 700 "$SSL_DIR"

            # Escribir el certificado
            cat > "$SSL_DIR/cert.pem" <<'CERT_EOF'
            $SSL_CERT
            CERT_EOF

            # Escribir la clave privada
            cat > "$SSL_DIR/key.pem" <<'KEY_EOF'
            $SSL_KEY
            KEY_EOF

            chmod 600 "$SSL_DIR/key.pem"
            chmod 644 "$SSL_DIR/cert.pem"

            if command -v openssl >/dev/null 2>&1; then
              echo "Validando certificado..."
              openssl x509 -in "$SSL_DIR/cert.pem" -noout -subject -issuer -dates || true
            else
              echo "openssl no disponible en el VPS."
            fi

            echo "✅ Certificados actualizados correctamente en $SSL_DIR"
