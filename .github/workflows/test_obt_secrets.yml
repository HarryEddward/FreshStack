name: Actualizar certificados SSL en VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  PROJECT_PATH: /home/ubuntu/FreshStack
  REPO_URL: https://github.com/${{ github.repository }}.git

jobs:
  obtain-certificates:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy SSL to VPS via SSH
        uses: appleboy/ssh-action@v1
        # Si quieres usar la version exacta que comentaste, usa @v1.0.3;
        # @v1 apunta a la última estable de la v1.
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}   # opcional, si no existe usa 22 por defecto
          script: |
            set -euo pipefail

            # Ruta donde quieres dejar los archivos
            SSL_DIR="${PROJECT_PATH}/ssl"
            mkdir -p "$SSL_DIR"
            chmod 700 "$SSL_DIR"

            # Escribir el certificado (preserva saltos de línea exactamente)
            cat > "$SSL_DIR/cert.pem" <<'CERT_EOF'
            ${{ secrets.SSL_CERT }}
            CERT_EOF

            # Escribir la clave privada (preserva saltos de línea exactamente)
            cat > "$SSL_DIR/key.pem" <<'KEY_EOF'
            ${{ secrets.SSL_KEY }}
            KEY_EOF

            # Ajustar permisos: la key privada sólo para el owner
            chmod 600 "$SSL_DIR/key.pem"
            chmod 644 "$SSL_DIR/cert.pem"

            # Comprobación NO-EXPOSING: mostrar metadatos del certificado
            if command -v openssl >/dev/null 2>&1; then
              openssl x509 -in "$SSL_DIR/cert.pem" -noout -subject -issuer -dates || true
            else
              echo "openssl no disponible en el VPS para validar el certificado."
            fi

            echo "Certificados actualizados en $SSL_DIR"
