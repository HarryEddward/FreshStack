secrets:
  REDIS_PASSWORD:
    external: true

networks:
  traefik-public:
    external: true

volumes:
  redis_master_data:
    driver: local
  redis_replica_data:
    driver: local
  redis_sentinel_data:
    driver: local

services:
  # Redis Master
  redis-master:
    image: bitnami/redis:latest
    container_name: redis-master
    hostname: redis-master
    secrets:
      - REDIS_PASSWORD
    environment:
      - REDIS_REPLICATION_MODE=master
      - REDIS_PASSWORD_FILE=/run/secrets/REDIS_PASSWORD
      - REDIS_PORT_NUMBER=6379
    volumes:
      - redis_master_data:/bitnami/redis/data
    ports:
      - "6379:6379"
    networks:
      - traefik-public
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $(cat /run/secrets/REDIS_PASSWORD) ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      restart_policy:
        condition: any

  # Redis Replica (Slave)
  redis-replica:
    image: bitnami/redis:latest
    container_name: redis-replica
    hostname: redis-replica
    secrets:
      - REDIS_PASSWORD
    environment:
      - REDIS_REPLICATION_MODE=slave
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT_NUMBER=6379
      - REDIS_MASTER_PASSWORD_FILE=/run/secrets/REDIS_PASSWORD
      - REDIS_PASSWORD_FILE=/run/secrets/REDIS_PASSWORD
      - REDIS_PORT_NUMBER=6379
    volumes:
      - redis_replica_data:/bitnami/redis/data
    ports:
      - "6380:6379"
    networks:
      - traefik-public
    depends_on:
      - redis-master
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $(cat /run/secrets/REDIS_PASSWORD) ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      restart_policy:
        condition: any

  # Redis Sentinel
  redis-sentinel:
    image: bitnami/redis-sentinel:latest
    container_name: redis-sentinel
    hostname: redis-sentinel
    secrets:
      - REDIS_PASSWORD
    environment:
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT_NUMBER=6379
      - REDIS_MASTER_PASSWORD_FILE=/run/secrets/REDIS_PASSWORD
      - REDIS_SENTINEL_PASSWORD_FILE=/run/secrets/REDIS_PASSWORD
      - REDIS_SENTINEL_QUORUM=1
      - REDIS_SENTINEL_DOWN_AFTER=5000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=10000
      - REDIS_SENTINEL_PORT_NUMBER=26379
    volumes:
      - redis_sentinel_data:/bitnami/redis-sentinel
    ports:
      - "26379:26379"
    networks:
      - traefik-public
    depends_on:
      - redis-master
      - redis-replica
    deploy:
      restart_policy:
        condition: any