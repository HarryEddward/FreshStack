version: "3.8"

services:
  traefik:
    image: traefik:v3.1
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.watch=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=traefik-public"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--global.sendAnonymousUsage=false"
      - "--experimental.plugins.crowdsec-bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.crowdsec-bouncer.version=v1.4.5"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    volumes:
      - "traefik-logs:/var/log/traefik"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    secrets:
      - source: ssl_cert
        target: /etc/traefik/certs/cafebuy.crt
      - source: ssl_key
        target: /etc/traefik/certs/cafebuy.key
      - source: crowdsec_bouncer_key
        target: /run/secrets/crowdsec_bouncer_key
      - source: traefik_dashboard_auth
        target: /run/secrets/traefik_dashboard_auth
    configs:
      - source: tls_conf
        target: /etc/traefik/dynamic/tls.yaml
    networks:
      - traefik-public
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        # Dummy port for Swarm
        - "traefik.http.services.traefik.loadbalancer.server.port=888"
        # Router for the dashboard
        - "traefik.http.routers.traefik-dashboard.rule=Host(`www.cafebuy.es`) && PathPrefix(`/traefik`)"
        - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
        - "traefik.http.routers.traefik-dashboard.service=api@internal"
        - "traefik.http.routers.traefik-dashboard.tls=true"
        - "traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth"
        # Middleware for authentication
        - "traefik.http.middlewares.dashboard-auth.basicauth.usersfile=/run/secrets/traefik_dashboard_auth"
        # CrowdSec middlewares
        - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.enabled=true"
        - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.loglevel=INFO"
        - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdsecMode=stream"
        - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdsecLapiScheme=http"
        - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdsecLapiHost=crowdsec:8080"
        - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdsecLapiKeyFile=/run/secrets/crowdsec_bouncer_key"
        - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.defaultDecisionSeconds=60"
        - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.updateIntervalSeconds=60"

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    environment:
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve
      - GID=0
    secrets:
      - source: crowdsec_bouncer_key
        target: /run/secrets/crowdsec_bouncer_key
    configs:
      - source: crowdsec_acquis
        target: /etc/crowdsec/acquis.yaml
    volumes:
      - crowdsec-db:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - traefik-logs:/var/log/traefik:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: ["/bin/sh", "-c", "if [ -f /run/secrets/crowdsec_bouncer_key ] && ! cscli bouncers list | grep -q 'traefik-bouncer'; then cscli bouncers add traefik-bouncer --key $(cat /run/secrets/crowdsec_bouncer_key); fi; /docker_start.sh"]
    networks:
      - traefik-public
    deploy:
      placement:
        constraints:
          - node.role == manager

networks:
  traefik-public:
    external: true

secrets:
  ssl_cert:
    external: true
  ssl_key:
    external: true
  crowdsec_bouncer_key:
    external: true
  traefik_dashboard_auth:
    external: true

configs:
  tls_conf:
    external: true
  crowdsec_acquis:
    external: true

volumes:
  crowdsec-db:
    driver: local
  crowdsec-config:
    driver: local
  traefik-logs:
    driver: local